services:
  postgres:
    build:
      context: ./docker/postgres
    image: pixsmith/postgres:17
    environment:
      # Superuser — administration only. The app connects as APP_DB_USER.
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-pixsmith_auth}

      # Consumed once by docker/postgres/init/01-create-app-role.sh.
      - APP_DB_USER=${APP_DB_USER:-pixsmith_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      # Bound to loopback so the database is not exposed on the host's public
      # interfaces. Remove this block entirely if you never connect from the host.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - authserver-network

  authserver:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Data-protection keys live here. Still required on Postgres — losing them
      # invalidates every issued token.
      - auth-data:/app/data
    environment:
      # Override the public-facing base URI used in OIDC redirect URIs.
      # Set this to the URL users actually type in their browser.
      - OpenIddict__BlazorClient__BaseUri=${AUTH_BASE_URI:-http://localhost:8080}

      # Override the M2M secret. Use Docker secrets or an env file in production.
      - OpenIddict__M2MClient__ClientSecret=${M2M_CLIENT_SECRET:?set M2M_CLIENT_SECRET in .env}

      - Database__Provider=Postgres
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-pixsmith_auth};Username=${APP_DB_USER:-pixsmith_app};Password=${APP_DB_PASSWORD}

      # To go back to SQLite, comment out the two lines above and uncomment:
      # - Database__Provider=Sqlite
      # - ConnectionStrings__DefaultConnection=Data Source=/app/data/auth.db
    depends_on:
      postgres:
        # EF Core migrations run at startup, so the database must be accepting
        # connections first — not merely have a running container.
        condition: service_healthy
    restart: unless-stopped
    networks:
      - authserver-network

volumes:
  auth-data:
  postgres-data:

networks:
  authserver-network:
    # Set DOCKER_NETWORK_NAME to join a specific Docker network (e.g. one
    # shared with a reverse proxy or a Postgres container). Defaults to a
    # project-local network if not set.
    name: ${DOCKER_NETWORK_NAME:-pixsmith-authorization}
    # Set DOCKER_NETWORK_EXTERNAL=true to join a network that already exists
    # instead of letting Compose create one.
    external: ${DOCKER_NETWORK_EXTERNAL:-false}
