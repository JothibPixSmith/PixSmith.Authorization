# TLS-terminating reverse proxy for the staging stack — the shape production is expected
# to have: browsers speak HTTPS to this, and it speaks plain HTTP to the auth server over
# the private Docker network.
#
# The auth server believes X-Forwarded-Proto only from this container's fixed address
# (ForwardedHeaders:KnownProxies), which is the configuration staging exists to exercise.

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # OIDC responses carry large cookies and Location headers; the defaults truncate them.
    proxy_buffer_size 16k;
    proxy_buffers     8 16k;

    location / {
        proxy_pass http://authserver:8080;

        # $http_host keeps the port, so the issuer comes out as https://localhost:8443/.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwritten, not appended: a client-supplied X-Forwarded-For never reaches the app.
        proxy_set_header X-Forwarded-For   $remote_addr;
    }
}
